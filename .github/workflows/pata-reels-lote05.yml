name: Pata por Perto — Cinco Reels Emocionais
on:
  push:
    branches: [main]
    paths:
      - 'pata-reels/lote05-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare cloud rendering environment
        run: |
          python -m pip install -q requests Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
      - name: Render and verify all five musical Reels
        run: python pata-reels/render_lote05.py
      - name: Release final MP4s, covers and captions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pata-reels-lote05-20261124 >/dev/null 2>&1 || gh release create pata-reels-lote05-20261124 --title 'Pata por Perto — 5 Reels emocionais' --notes 'Cinco vídeos verticais com cenas Pexels ilustrativas, música Mixkit, CTA ao projeto e verificação FFprobe de áudio AAC. Não afirma resgates próprios.'
          gh release upload pata-reels-lote05-20261124 pata-reels/dist_lote05/* --clobber
      - name: Archive output QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pata-reels-lote05-qa
          path: pata-reels/dist_lote05/
          if-no-files-found: ignore
