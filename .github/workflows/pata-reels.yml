name: Pata por Perto — Renderização de Reels
on:
  push:
    branches: [main]
    paths:
      - 'pata-reels/trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare editor in cloud runner
        run: |
          python -m pip install -q requests Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
      - name: Render and validate three Reels
        run: python pata-reels/render.py
      - name: Publish final media (public assets only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pata-emocional-20261124 >/dev/null 2>&1 || gh release create pata-emocional-20261124 --title 'Pata por Perto — Reels emocionais 24-11-2026' --notes '3 vídeos educativos 9:16 com música licenciada, CTA e áudio AAC verificado. Cenas ilustrativas Pexels.'
          gh release upload pata-emocional-20261124 pata-reels/dist/* --clobber
      - name: Preserve QA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pata-emocional-qa
          path: pata-reels/dist/
          if-no-files-found: ignore
